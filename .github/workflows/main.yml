name: Build Sekretary V4 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V4 project
        run: |
          rm -rf sekretary_android
          unzip -o sekretary_v4_manual_supabase_kit.zip
          cp supabase-config.js sekretary_android/app/src/main/assets/supabase-config.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: sekretary_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sekretary-v4-debug-apk
          path: sekretary_android/app/build/outputs/apk/debug/app-debug.apk
