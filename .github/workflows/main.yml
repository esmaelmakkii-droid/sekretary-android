name: Build Sekretary V5.2 Full Alarm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: rm -rf sekretary_android && unzip -q -o sekretary_v5_2_full_alarm.zip && mkdir -p sekretary_android/app/src/main/assets && cp supabase-config.js sekretary_android/app/src/main/assets/supabase-config.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: sekretary_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sekretary-v5-2-full-alarm-apk
          path: sekretary_android/app/build/outputs/apk/debug/app-debug.apk
