name: Build Sekretary V5.2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ready project
        run: rm -rf sekretary_android && unzip -q -o sekretary_v5_2_1_READY.zip

      - name: Verify Gradle root
        run: test -f sekretary_android/settings.gradle && test -f sekretary_android/build.gradle && test -f sekretary_android/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: sekretary_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sekretary-v5-2-1-full-alarm-apk
          path: sekretary_android/app/build/outputs/apk/debug/app-debug.apk
